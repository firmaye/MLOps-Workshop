prepare:
  test_months: 2        # most recent N months held out as the test set

train:
  model: logistic       # logistic | gbm
  C: 1.0                # logistic regularisation
  max_depth: 3          # gbm only
  learning_rate: 0.1    # gbm only
  n_estimators: 200     # gbm only

evaluate:
  alert_rate: 0.2       # share of children the clinic can follow up
