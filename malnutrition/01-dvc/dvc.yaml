# The pipeline: three stages, each = a command + what it reads (deps, params) + what it writes (outs).
# DVC hashes every dep/param; `dvc repro` reruns a stage only if one of them changed,
# and then everything downstream of it. Exact hashes of the last run are in dvc.lock.
stages:
  prepare:
    cmd: python src/prepare.py
    deps:                       # files this stage reads
      - src/prepare.py
      - data/raw
    params:                     # sections of params.yaml this stage reads
      - prepare
    outs:                       # files it writes: cached by DVC, gitignored, pushed with `dvc push`
      - data/processed

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - src/features.py
      - data/processed/train.csv
    params:
      - train
    outs:
      - model.pkl

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - src/features.py
      - model.pkl
      - data/processed/test.csv
    params:
      - evaluate
    outs:
      - metrics_by_group.json:  # per-group detail: a plain output, so `dvc exp show` stays readable
          cache: false          # cache: false = small file, kept in git instead of the DVC cache
    metrics:                    # numbers `dvc metrics diff/show` and `dvc exp show` compare
      - metrics.json:
          cache: false
    plots:                      # curves for `dvc plots show/diff`
      - plots/roc.csv:
          cache: false
          x: fpr
          y: tpr
      - plots/pr.csv:
          cache: false
          x: recall
          y: precision
